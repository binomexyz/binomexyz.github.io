name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check          # tipos y contenido (astro check)
      - run: npm run build          # incluye tokens + validación de contraste
      - name: Auditoría WCAG + SEO (axe-core)
        run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
