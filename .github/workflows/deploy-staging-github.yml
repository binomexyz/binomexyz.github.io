name: Deploy staging (GitHub Pages, otra cuenta)
# Validación abierta y noindex SIN publicar el código: compila aquí (repo privado) y sube solo dist/ a un repo
# público de otra cuenta que sirve GitHub Pages. NO toca binome.xyz (no hay dominio propio configurado).
# Se activa cuando existe el secret STAGING_DEPLOY_KEY (ver docs/07-staging.md). Sin él, termina en verde sin desplegar.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency: { group: staging-github, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
    steps:
      - name: Comprobar credenciales
        id: cred
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin STAGING_DEPLOY_KEY: staging en GitHub Pages no desplegado (ver docs/07-staging.md)."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cred.outputs.listo == 'true'
      - uses: actions/setup-node@v4
        if: steps.cred.outputs.listo == 'true'
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
        if: steps.cred.outputs.listo == 'true'
      - run: npm run build
        if: steps.cred.outputs.listo == 'true'
        env:
          PUBLIC_NOINDEX: 'true'                    # staging nunca se indexa
          PUBLIC_PREVIEW_LOCALES: 'true'            # muestra FR/EN provisionales
          SITE_URL: ${{ vars.STAGING_SITE_URL || 'https://binomexyz.github.io' }}
          BASE_PATH: ${{ vars.STAGING_BASE_PATH || '/https-binome.github.io/' }}
          PUBLIC_FORMSPREE_ID: ${{ vars.PUBLIC_FORMSPREE_ID }}
      - name: Publicar dist/ en el repo público de staging
        if: steps.cred.outputs.listo == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
          external_repository: ${{ vars.STAGING_REPO || 'binomexyz/https-binome.github.io' }}
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true          # un solo commit: sin historial acumulado
          commit_message: 'Staging noindex (compilado, sin código fuente)'
